name: Generate Random Number Site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Generate HTML
        run: |
          echo "Запуск генератора..."
          go run main.go
          echo "Генерация завершена!"
      
      - name: Show generated file
        run: |
          echo "Содержимое index.html:"
          head -20 index.html
      
      - name: Commit and push changes
        run: |
          git config --local user.name "GitHub Actions Bot"
          git config --local user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Update index.html"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2. Устанавливаем Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      # 3. Запускаем генератор
      - name: Generate HTML with random number
        run: |
          echo "🚀 Запуск генератора..."
          go run main.go
          echo "✅ Генерация завершена!"
      
      # 4. Показываем результат (для отладки)
      - name: Show generated file
        run: |
          echo "📄 Содержимое index.html:"
          head -20 index.html
          echo "..."
          echo "🎯 Случайное число в конце:"
          tail -5 index.html
      
      # 5. Коммитим и пушим изменения
      - name: Commit and push changes
        run: |
          git config --local user.name "GitHub Actions Bot"
          git config --local user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "🤖 Автоматическая генерация нового случайного числа [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
